<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endangered Species Tracker</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="alertBox" style="display: none;"></div>

    <div class="container">
        <div class="login-box">
            <h1>Endangered Species Tracker</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    <small id="username-conditions">Enter username assosiated with your account</small>

                    <label for="password">Password</label>
                    <input type="text" id="password" name="password" placeholder="Enter your password" required>
                    <small id="password-conditions">Enter password assosiated with your account</small>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <div style = "margin-top: 20px; text-align: center;">
                <a href="create-account.html">No account? Create one here</a>
            </div>
        </div>
    </div>
    <script src="js/run-query.js"></script>
    <script src="js/login-script.js"></script>
    <script src="js/validation-utilities.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endangered Species Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="navbar-container">
                <h1 class="navbar-title">Endangered Species Tracker</h1>
                <ul class="navbar-menu">
                    <li><a href="HomePage.html" class="active">Home</a></li>
                    <li><a href="TableEditing.html">Table Editing</a></li>
                    <li><a href="index.html" class="logout-btn">Logout</a></li>
                </ul>
            </div>
        </nav>

        <div class="chart-container">
            <canvas id="myChart">
                <p>alt fallback text?</p>
            </canvas>
        </div>
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/runQuery.js"></script>
    <script>
    
    const ctx = document.getElementById('myChart');
    
    function createChart(animalNames, sightingNumbers) {

        new Chart(ctx, {
            type: 'bar',
            data: {
            labels: animalNames,
            datasets: [{
                label: 'Top 10 Reported Evidence/Sightings',
                data: sightingNumbers,
                backgroundColor:"green"
            }]
            },
            options: {
                
            }
        });
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const queryResult = await runQuery(
            `SELECT Species.Name, COUNT(Report.SpeciesID)
            FROM Report
            JOIN Species ON Report.SpeciesID=Species.SpeciesID
            GROUP BY Report.SpeciesID
            LIMIT 10;`
        );

        if (queryResult.success && Array.isArray(queryResult.data)) {
            let animalNames = [];
            let sightingNumbers = [];

            for (let i = 0; i < queryResult.data.length; i++) {
                animalNames[i] = queryResult.data[i].Name;
                sightingNumbers[i] = queryResult.data[i]["COUNT(Report.SpeciesID)"];
            }

            console.log(animalNames);
            console.log(sightingNumbers);

            createChart(animalNames, sightingNumbers);
        }
    });

    </script>
</body>
</html>

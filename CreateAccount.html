<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
    <div class="login-box">

        <h1>Create an account</h1>
        <form action="/login" method="post" id="loginForm">
            <div class="form-group">
                <label for="username_entry">Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
                <p><small> cannot be &gt 8 characters, contain spaces or contain special characters (&lt;, &gt;, &amp;, &quot;, &#39;) </small></p>
            </div>

            <div class="form-group">
                <label for="forename">Forename:</label>
                <input type="text" id="forename" name="forename" placeholder="Enter your forename" required>
            </div>

            <div class="form-group">
            <label for="forename">Surname:</label>
            <input type="text" id="surname" name="surname" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
            <label for="forename">Email:</label>
            <input type="text" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endangered Species Tracker - Table Editing</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        form, table {
            margin: 15px 0;
        }
        tr:nth-child(even) {
            background-color:lightgrey;
        }
        table {
            width:100%;
        }
        form button {
            display:block;
            padding:5px;
        }

        .edit-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .edit-modal.is-open {
            display: flex;
        }

        .edit-modal-panel {
            position: relative;
            width: min(520px, 100%);
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .edit-modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            border: none;
            background: transparent;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .edit-modal-section {
            display: none;
        }

        .edit-modal-section.is-active {
            display: block;
        }

        .edit-modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>

</head>
<body>
<nav class="navbar">
    <div class="navbar-container">
        <h1 class="navbar-title">Endangered Species Tracker</h1>
        <ul class="navbar-menu">
            <li><a href="HomePage.html">Home</a></li>
            <li><a href="TableEditing.html" class="active">Table Editing</a></li>
            <li><a href="index.html" class="logout-btn">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <h1>Data Editor</h1>

    <div id="loggers" class="form-table-container">

        <h2>Logger Info</h2>
        <form id="logger-form">
            <label for="forename-input">Forename</label>
            <input type="text" id="forename-input" required> <br>

            <label for="surname-input">Surname</label>
            <input type="text" id="surname-input" required> <br>

            <label for="email-input">Email</label>
            <input type="email" id="email-input" required> <br>

            <button id="logger-submit-button">Add Logger</button>

        </form>

        <table id="logger-table">
            <thead>
            <tr>
                <th>Logger ID</th>
                <th>Forename</th>
                <th>Surname</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="logger-table-body"></tbody>
        </table>
    </div>

    <div id="edit-modal" class="edit-modal" aria-hidden="true">
    <div class="edit-modal-panel" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <button type="button" id="edit-modal-close" class="edit-modal-close" aria-label="Close edit popup">&times;</button>

        <section id="logger-edit-section" class="edit-modal-section">
            <h2 id="edit-modal-title">Edit Logger</h2>
            <form id="logger-edit-form">
                <label for="edit-forename-input">Forename</label>
                <input type="text" id="edit-forename-input" required> <br>

                <label for="edit-surname-input">Surname</label>
                <input type="text" id="edit-surname-input" required> <br>

                <label for="edit-email-input">Email</label>
                <input type="email" id="edit-email-input" required> <br>

                <div class="edit-modal-actions">
                    <button type="submit">Save Logger</button>
                    <button type="button" id="logger-edit-cancel">Cancel</button>
                </div>
            </form>
        </section>
    </div>
</div>    
    
<script src="js/runQuery.js"></script>
<script src="js/tableEditing.js"></script>

<footer class="footer">
    <p>&copy; 2025 Endangered Species Tracker. Supporting conservation through data.</p>
</footer>
</body>
</html>

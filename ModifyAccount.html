<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modify account</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <h1 class="navbar-title">Endangered Species Tracker</h1>
            <ul class="navbar-menu">
                <li><a href="HomePage.html" class="active">Home</a></li>
                <li><a href="TableEditing.html">Table Editing</a></li>
                <li><a href="index.html" class="logout-btn">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="dashboard-container">
        

        <aside class="sidebar">
            <button class="sidebar-btn">VIEW ACCOUNT</button>
            <button class="sidebar-btn active">MODIFY ACCOUNT</button>
            <button class="sidebar-btn">DELETE ACCOUNT</button>
        </aside>

        <main class="main-content">
            <div class="modify-header">Modify account details:</div>

            <form id="modifyForm" class="modify-form">
                
                <div class="input-row">
                    <input type="text" id="username" name="username" placeholder="Enter new username">
                    <button type="submit" class="submit-btn">Submit</button>
                </div>

                <div class="input-row">
                    <input type="text" id="forename" name="forename" placeholder="Enter new forename">
                    <button type="submit" class="submit-btn">Submit</button>
                </div>

                <div class="input-row">
                    <input type="text" id="surname" name="surname" placeholder="Enter new surname">
                    <button type="submit" class="submit-btn">Submit</button>
                </div>

                <div class="input-row">
                    <input type="email" id="email" name="email" placeholder="Enter new email">
                    <button type="submit" class="submit-btn">Submit</button>
                </div>

            </form>
        </main>

    </div>

    <script src="CreateAccount.js"></script>
</body>
</html>

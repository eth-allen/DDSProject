    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/runQuery.js"></script>
    <script>
    
    function createChart(animalNames, sightingNumbers) {
        const ctx = document.getElementById('myChart');

        new Chart(ctx, {
            type: 'bar',
            data: {
            labels: animalNames,
            datasets: [{
                label: 'Top 10 Reported Evidence/Sightings',
                data: sightingNumbers,
                backgroundColor:"green"
            }]
            },
            options: {
                
            }
        });
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const queryResult = await runQuery(
            `SELECT Species.CommonName, COUNT(Report.SpeciesID)
            FROM Report
            JOIN Species ON Report.SpeciesID=Species.SpeciesID
            WHERE Report.ReportType='Animal Spotting'
            GROUP BY Report.SpeciesID
            ORDER BY COUNT(Report.SpeciesID) DESC
            LIMIT 10;`
        );

        if (queryResult.success && Array.isArray(queryResult.data)) {
            let animalNames = [];
            let sightingNumbers = [];

            for (let i = 0; i < queryResult.data.length; i++) {
                animalNames[i] = queryResult.data[i].CommonName;
                sightingNumbers[i] = queryResult.data[i]["COUNT(Report.SpeciesID)"];
            }

            console.log(animalNames);
            console.log(sightingNumbers);

            createChart(animalNames, sightingNumbers);
        }
    });

    </script>

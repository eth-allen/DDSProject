<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endangered Species Tracker - Data submission</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/LoginAuthorisation.js"></script>
    <style>
        form button {
            display:block;
            padding:5px;
        }

        .submit-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto 1.5rem;
            padding: 0 20px;
        }

        .submit-tab-button {
            border: 1px solid #ccc;
            border-radius: 999px;
            background: #f5f5f5;
            padding: 0.6rem 1rem;
            cursor: pointer;
        }

        .submit-tab-button.is-active {
            background: #2c6fbb;
            color: #fff;
            border-color: #2c6fbb;
        }

        .submit-tab-panel {
            display: none;
        }

        .submit-tab-panel.is-active {
            display: block;
        }

        .edit-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .edit-modal.is-open {
            display: flex;
        }

        .edit-modal-panel {
            position: relative;
            width: min(520px, 100%);
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .edit-modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            border: none;
            background: transparent;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .edit-modal-section {
            display: none;
        }

        .edit-modal-section.is-active {
            display: block;
        }

        .edit-modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .form-group-radio {
            margin-bottom: 20px;
        }

        .form-group-radio div {
            margin-bottom: 8px;
        }

        .form-group-radio label {
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group-radio input {
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group-radio input:focus {
            outline: none;
            border-color: #2d5016;
            background-color: #f9fdf6;
        }
    </style>

</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <h1 class="navbar-title">
                <a href="HomePage.html" class="logo-link">Endangered Species Tracker</a></h1>
            <ul class="navbar-menu">
                <li><a href="HomePage.html">Home</a></li>
                <li><a href="SubmitData.html" class="active">Submit data</a></li>
                <li><a href="ViewTables.html">View user reports</a></li>
                <li><a href="ModifyAccount.html">Modify your account</a></li>
                <li><a href="Reports.html" >Reports</a></li>
                <li><a href="AboutUs.html">About us</a></li>
                <li><a href="index.html" class="logout-button">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="hero-section">
        <div class="hero-content">
            <h2>Submit data</h2>
        </div>
    </div>

<div class="submit-tabs" role="tablist" aria-label="Submit data tabs">
    <button id="report-tab" type="button" class="submit-tab-button is-active" data-submit-tab="report" role="tab" aria-selected="true" aria-controls="report">Submit Report</button>
    <button id="species-tab" type="button" class="submit-tab-button" data-submit-tab="species" role="tab" aria-selected="false" aria-controls="species">Add Species</button>
</div>

<div class="container">
    <div id="report" class="submit-tab-panel is-active" data-submit-panel="report" role="tabpanel" aria-labelledby="report-tab">
        <div id="reports">

        

        <form id="report-form">
            
            <div class="form-group">
                <label for="country-input">Country</label> 
                <input type="text" id="country-input" placeholder="Enter country name" list="country-names" required> 
            </div>

            <datalist id="country-names">

            </datalist>

            <div class="form-group">
                <label for="species-selection">Species</label>
                <select id="species-selection" required>
                    <option value="species1">1st Species</option>
                    <option value="species2">2st Species</option>
                </select> 
            </div>

            <div class="form-group">
                <label for="tracked-animal-selection">Associate this report with a tracked animal (Optional)</label>
                <select id="tracked-animal-selection" required>
                    <option value="none">None</option>
                </select> 
            </div>
            
            <!--Add in radio buttons that are hidden/disabled when the previous select's value is none but required 
            when otherwise that change the status of the selected tracked animal when the report is submitted-->

            <div class="form-group-radio" id="tracked-animal-status-radio-group">
                <fieldset>
                    <legend>What is the status of the selected tracked animal?</legend>
                    <div>
                    <label for="alive-radio">Alive</label> 
                    <input type="radio" id="alive-radio" name="tracked-animal-status" value="Alive" disabled>
                    </div>
                    
                    <div>
                    <label for="dead-radio">Dead</label>
                    <input type="radio" id="dead-radio" name="tracked-animal-status" value="Dead" disabled>
                    </div>
                    
                    <div>
                    <label for="hospitalised-radio">Hospitalised</label>
                    <input type="radio" id="hospitalised-radio" name="tracked-animal-status" value="Hospitalised" disabled>
                    </div>
                </fieldset>
            </div>

            <div class="form-group">
                <label for="evidence-file-input">Choose Evidence File</label>
                <input type="file" id="evidence-file-input" required accept=".png, .jpeg, .jpeg, .mp3, .mp4, .doc, .docx, .txt">
            </div>

            <div class="form-group">
                <label for="evidence-description-input">Evidence Description</label>
                <input type="text" id="evidence-description-input" placeholder="Enter evidence description here" required> 
            </div>

            <div class="form-group-radio">
                <fielset>
                    <legend>Choose the report type</legend>

                    <div>
                    <label for="poaching-radio">Poaching</label> 
                    <input type="radio" id="poaching-radio" name="report-type-input" value="Poaching" required>
                    </div>
                    
                    <div>
                    <label for="spotting-radio">Animal Spotting</label>
                    <input type="radio" id="spotting-radio" name="report-type-input" value="Animal Spotting" required>
                    </div>
                </fielset>
            </div>

            <div class="form-group">
                <label for="description-input">Report Description</label>
                <input type="text" id="description-input" placeholder="Enter report description here" required> 
            </div>

            <button id="report-submit-button">Submit Report</button>
        </form>
        </div>
    </div>

    <div id="species" class="submit-tab-panel" data-submit-panel="species" role="tabpanel" aria-labelledby="species-tab">
        <form id="species-form">
            <div class="form-group">
                <label for="species-scientific-name-input">Scientific Name</label>
                <input type="text" id="species-scientific-name-input" placeholder="Enter scientific name" required>
            </div>

            <div class="form-group">
                <label for="species-common-name-input">Common Name</label>
                <input type="text" id="species-common-name-input" placeholder="Enter common name" required>
            </div>

            <div class="form-group">
                <label for="species-conservation-status-input">Conservation Status</label>
                <select id="species-conservation-status-input" required>
                    <option value="">Select a status</option>
                    <option value="Extinct">Extinct</option>
                    <option value="Extinct in the Wild">Extinct in the Wild</option>
                    <option value="Critically Endangered">Critically Endangered</option>
                    <option value="Endangered">Endangered</option>
                    <option value="Vulnerable">Vulnerable</option>
                    <option value="Near Threatened">Near Threatened</option>
                    <option value="Least Concern">Least Concern</option>
                    <option value="Data Deficient">Data Deficient</option>
                </select>
            </div>

            <button id="species-submit-button" type="submit">Add Species</button>
        </form>
    </div>

</div>



<script src="js/runQuery.js"></script>
<script src="js/submitData.js"></script>
<script>
    const submitTabButtons = [...document.querySelectorAll("[data-submit-tab]")];
    const submitTabPanels = {
        report: document.querySelector('[data-submit-panel="report"]'),
        species: document.querySelector('[data-submit-panel="species"]')
    };

    function setActiveSubmitTab(tabName) {
        Object.entries(submitTabPanels).forEach(([name, panel]) => panel?.classList.toggle("is-active", name === tabName));
        submitTabButtons.forEach((button) => {
            const isActive = button.dataset.submitTab === tabName;
            button.classList.toggle("is-active", isActive);
            button.setAttribute("aria-selected", String(isActive));
            button.tabIndex = isActive ? 0 : -1;
        });
    }

    if (submitTabButtons.length) {
        submitTabButtons.forEach((button) => button.addEventListener("click", () => setActiveSubmitTab(button.dataset.submitTab)));
    }
</script>


<footer class="footer">
    <p>&copy; 2026 Endangered Species Tracker. Supporting conservation through data.</p>
</footer>
</body>
</html>

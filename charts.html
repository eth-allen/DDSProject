    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/runQuery.js"></script>
    <script>
    
    const ctx = document.getElementById('myChart');
    
    function createChart() {
        const animalNames = ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange']; //species names will go here
        const sightingNumbers = [120, 19, 3, 5, 2, 3]; //number of reports with reporttype of animal sightings would go here

        new Chart(ctx, {
            type: 'bar',
            data: {
            labels: animalNames,
            datasets: [{
                label: 'Top 10 Reported Evidence/Sightings',
                data: sightingNumbers,
                backgroundColor:"green"
            }]
            },
            options: {
                
            }
        });
    }

    document.addEventListener("DOMContentLoaded", async () => {
        

        createChart();
    });

    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endangered Species Tracker - Report submission</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/LoginAuthorisation.js"></script>
    <style>
        form button {
            display:block;
            padding:5px;
        }

        .edit-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .edit-modal.is-open {
            display: flex;
        }

        .edit-modal-panel {
            position: relative;
            width: min(520px, 100%);
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .edit-modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            border: none;
            background: transparent;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .edit-modal-section {
            display: none;
        }

        .edit-modal-section.is-active {
            display: block;
        }

        .edit-modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .form-group-radio {
            margin-bottom: 20px;
        }

        .form-group-radio div {
            margin-bottom: 8px;
        }

        .form-group-radio label {
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group-radio input {
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group-radio input:focus {
            outline: none;
            border-color: #2d5016;
            background-color: #f9fdf6;
        }
    </style>

</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <h1 class="navbar-title">
                <a href="HomePage.html" class="logo-link">Endangered Species Tracker</a></h1>
            <ul class="navbar-menu">
                <li><a href="HomePage.html">Home</a></li>
                <li><a href="SubmitReport.html" class="active">Submit a report</a></li>
                <li><a href="ViewTables.html">View user reports</a></li>
                <li><a href="ModifyAccount.html">Modify your account</a></li>
                <li><a href="Reports.html" >Reports</a></li>
                <li><a href="AboutUs.html">About us</a></li>
                <li><a href="index.html" class="logout-button">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="hero-section">
        <div class="hero-content">
            <h2>Submit a report</h2>
        </div>
    </div>

<div class="container">
    <div id="reports">

        

        <form id="report-form">
            
            <div class="form-group">
                <label for="country-input">Country</label> 
                <input type="text" id="country-input" placeholder="Enter country name" list="country-names" required> 
            </div>

            <datalist id="country-names">

            </datalist>

            <div class="form-group">
                <label for="latitude-input">Latitude</label> 
                <input type="number" step="any" id="latitude-input" placeholder="Enter latitude" required> 
            </div>

            <div class="form-group">
                <label for="longitude-input">Longitude</label> 
                <input type="number" step="any" id="longitude-input" placeholder="Enter longitude" required> 
            </div>

            <div class="form-group">
                <label for="evidence-file-input">Choose Evidence File</label>
                <input type="file" id="evidence-file-input" required accept=".png, .jpeg, .jpeg, .mp3, .mp4, .doc, .docx, .txt">
            </div>

            <div class="form-group">
                <label for="evidence-description-input">Evidence Description</label>
                <input type="text" id="evidence-description-input" placeholder="Enter evidence description here" required> 
            </div>

            <div class="form-group">
                <label for="species-selection">Species</label>
                <select id="species-selection" required>
                    <option value="species1">1st Species</option>
                    <option value="species2">2st Species</option>
                </select> 
            </div>

            <div class="form-group">
                <label for="description-input">Description</label>
                <input type="text" id="description-input" placeholder="Enter description here" required> 
            </div>

            <div class="form-group-radio">
                <div>
                <label for="poaching-radio">Poaching</label> 
                <input type="radio" id="poaching-radio" name="report-type-input" value="Poaching" required>
                </div>
                
                <div>
                <label for="animal-spotting">Animal Spotting</label>
                <input type="radio" id="spotting-radio" name="report-type-input" value="Animal Spotting" required>
                </div>
            </div>

            <button id="report-submit-button">Submit Report</button>
        </form>
    </div>

</div>



<script src="js/runQuery.js"></script>
<script src="js/submitReport.js"></script>


<footer class="footer">
    <p>&copy; 2026 Endangered Species Tracker. Supporting conservation through data.</p>
</footer>
</body>
</html>

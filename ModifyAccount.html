<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endangered Species Tracker - Modify account</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/modifyAccount.css">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-container">
            <h1 class="navbar-title">
                <a href="HomePage.html" class="logo-link">Endangered Species Tracker</a></h1>
            <ul class="navbar-menu">
                <li><a href="HomePage.html" class="active">Home</a></li>
                <li><a href="SubmitReport.html">Submit a report</a></li>
                <li><a href="ViewTables.html">View user reports</a></li>
                <li><a href="ModifyAccount.html">Modify your account</a></li>
                <li><a href="AboutUs.html">About us</a></li>
                <li><a href="index.html" class="logout-btn">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="account-wrapper">
        
        <!--Sidebar tabs-->
        <aside class="sidebar">
            <button class="sidebar-btn">View Account</button>
            <button class="sidebar-btn active">Modify Account</button>
            <button class="sidebar-btn">Delete Account</button>
        </aside>

         <!--Main content section-->
        <main class="main-content">

            <!--View account panel section-->
            <section id="view-panel" class="account-panel">
                <h2 class="section-title" style="text-align: left; margin-bottom: 25px; font-size: 26px;">View account details</h2>
                    <div class="detail-group">
                        <span class="detail-label">Username</span>
                        <strong class="detail-value">NatureLover99</strong>
                    </div>

                    <div class="form-group">
                        <label for="forename">Forename</label>
                        <input type="text" id="forename" name="forename" placeholder="Enter new forename">
                    </div>

                    <div class="form-group">
                        <label for="surname">Surname</label>
                        <input type="text" id="surname" name="surname" placeholder="Enter new surname">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter new email">
                    </div>
            </section>

            <!--Edit account panel section-->
            <section id="edit-panel" class="account-panel">
                <h2 class="section-title" style="text-align: left; margin-bottom: 25px; font-size: 26px;">Modify Account Details</h2>

                <form id="modifyForm" class="account-form">
                    
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter new username">
                    </div>

                    <div class="form-group">
                        <label for="forename">Forename</label>
                        <input type="text" id="forename" name="forename" placeholder="Enter new forename">
                    </div>

                    <div class="form-group">
                        <label for="surname">Surname</label>
                        <input type="text" id="surname" name="surname" placeholder="Enter new surname">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter new email">
                    </div>

                    <button type="submit" class="btn update-btn">Save Changes</button>
                </form>
            </section>

            <!--Delete account panel section-->
            <section id="delete-panel" class="account-panel">
                
            </section>
        </main>

    </div>
    
    <footer class="footer">
        <p>&copy; 2026 Endangered Species Tracker. Supporting conservation through data.</p>
    </footer>
    <script src="CreateAccount.js"></script>
</body>

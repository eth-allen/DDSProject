<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endangered Species Tracker - Table Editing</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        form, table {
            margin: 15px 0;
        }
        tr:nth-child(even) {
            background-color:lightgrey;
        }
        table {
            width:100%;
        }
        form button {
            display:block;
            padding:5px;
        }

        .edit-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .edit-modal.is-open {
            display: flex;
        }

        .edit-modal-panel {
            position: relative;
            width: min(520px, 100%);
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        }

        .edit-modal-close {
            position: absolute;
            top: 10px;
            right: 10px;
            border: none;
            background: transparent;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .edit-modal-section {
            display: none;
        }

        .edit-modal-section.is-active {
            display: block;
        }

        .edit-modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>

</head>
<body>
<nav class="navbar">
    <div class="navbar-container">
        <h1 class="navbar-title">Endangered Species Tracker</h1>
        <ul class="navbar-menu">
            <li><a href="HomePage.html">Home</a></li>
            <li><a href="TableEditing.html" class="active">Table Editing</a></li>
            <li><a href="index.html" class="logout-btn">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <h1>Data Editor</h1>

    <h2>Locations</h2>
        <form id="location-form"> 

            <label for="country-input">Country</label>
            <input type="text" id="country-input" required> <br>

            <label for="latitude-input">Latitude</label>
            <input type="number" step="any" id="latitude-input" required> <br>

            <label for="longitude-input">Longitude</label>
            <input type="number" step="any" id="longitude-input" required> <br>

            <button id="location-submit-button">Add New Location</button>

        </form>

        <table id="location-table">
            <thead>
            <tr>
                <th>Location ID</th>
                <th>Country</th>
                <th>Latitude</th>
                <th>Longitude</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="location-table-body"></tbody>
        </table>
    </div>

    <div id="edit-modal" class="edit-modal" aria-hidden="true">
    <div class="edit-modal-panel" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <button type="button" id="edit-modal-close" class="edit-modal-close" aria-label="Close edit popup">&times;</button>

        <section id="location-edit-section" class="edit-modal-section">
            <h2>Edit Location</h2>
            <form id="location-edit-form">
                <label for="edit-country-input">Country</label>
                <input type="text" id="edit-country-input" required> <br>

                <label for="edit-latitude-input">Latitude</label>
                <input type="number" step="any" id="edit-latitude-input" required> <br>

                <label for="edit-longitude-input">Longitude</label>
                <input type="number" step="any" id="edit-longitude-input" required> <br>

                <div class="edit-modal-actions">
                    <button type="submit">Save Location</button>
                    <button type="button" id="location-edit-cancel">Cancel</button>
                </div>
            </form>
        </section>
    </div>    
</div>    
    
<script src="js/runQuery.js"></script>
<script src="js/tableEditing.js"></script>

<footer class="footer">
    <p>&copy; 2025 Endangered Species Tracker. Supporting conservation through data.</p>
</footer>
</body>
</html>
